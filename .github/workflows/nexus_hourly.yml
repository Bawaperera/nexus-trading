name: NEXUS Hourly Signal

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nexus:
    name: Generate trading signal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NEXUS signal engine
        env:
          TRADING_SYMBOL:     "BTC/USDT"
          ACCOUNT_SIZE:       "1000"
          RISK_PCT:           "0.01"
          MIN_CONFIDENCE:     "0.58"
          BINANCE_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_nexus.py

      - name: Commit logs
        run: |
          git config user.name  "NEXUS Bot"
          git config user.email "nexus@github-actions"
          mkdir -p logs
          git add -f logs/signals_log.csv    || true
          git add -f logs/validation_log.csv || true
          git diff --staged --quiet || git commit -m "signal: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && echo "Pushed on attempt $i" && break
            echo "Attempt $i failed, retrying in ${i}s..."
            sleep $i
          done